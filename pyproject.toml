[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-evolve-adaptive-trigger"
version = "0.1.0"
description = "Controller V3 adaptive WAIT/UPDATE scheduling for self-evolving agent skill methods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.30", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["controller_v3*"]

[tool.ruff]
line-length = 100
target-version = "py310"
